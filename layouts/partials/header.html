<h1 class="us">Emily &amp; Josiah</h1>
<nav>
  <input type="checkbox" id="nav-check" />
  <label for="nav-check" class="check-btn-closed">[Menu]</label>
  <label for="nav-check" class="check-btn-opened">[Menu]</label>
  <ul>
    {{ range .Site.Menus.main }}
      {{ if .Page }}
        <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent .Menu . }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    {{ end }}
  </ul>
</nav>
